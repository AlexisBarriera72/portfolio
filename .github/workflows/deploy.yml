name: Deploy

# Cloudflare deploys come from here, not from Cloudflare's own Git builds
# (disconnect those on the Worker, or both will publish).
#
#   Pull request → preview: a draft build uploaded as a separate version at
#                  https://pr-<number>-portfolio.<subdomain>.workers.dev,
#                  then the browser tests run against it. Production is untouched.
#   Push to main → production: the strict `npm run build`, then `wrangler deploy`.
#                  That build refuses to run while anything is fake (see
#                  `npm run check:launch`), so the draft can never go live —
#                  until launch, this job fails on purpose.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare
# Workers") and CLOUDFLARE_ACCOUNT_ID.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER: npx --yes wrangler@4

jobs:
  preview:
    # Pull requests from forks get no secrets, so they can't deploy.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:draft
      - name: Upload preview version
        id: upload
        run: |
          $WRANGLER versions upload --preview-alias "pr-${{ github.event.number }}" 2>&1 | tee upload.log
          url=$(grep -oE "https://pr-${{ github.event.number }}-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          if [ -z "$url" ]; then echo "::error::No preview URL in the wrangler output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against the preview
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ steps.upload.outputs.url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Strict build: fails while the launch checklist has anything left.
      - run: npm run build
      - run: $WRANGLER deploy
