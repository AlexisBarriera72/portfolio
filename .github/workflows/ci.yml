name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type check + content tests + build. `build:draft` skips only the launch
      # checks (placeholders, missing media); switch this to `npm run build`
      # once the real phone number, domain and photos are in.
      - run: npm run build:draft
