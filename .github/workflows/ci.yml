name: CI

# Three jobs:
#  - verify: every push and pull request. Type check, unit tests, draft build,
#    browser tests against that build.
#  - preview: repository pull requests and main. Deploys the draft build to its own Worker
#    (portfolio-preview), then checks the live preview.
#  - production: pushes to main. Deploys only the strict build — it refuses to
#    build while anything is fake or missing, so until the launch checklist is
#    done this job fails and nothing reaches the real site. Then checks the
#    real domain and measures loading speed.
# Deploys need two repository secrets: CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID (README → "Deploying").

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LHCI: '@lhci/cli@0.15.1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Type check + unit tests + build, placeholders allowed.
      - run: npm run build:draft
      # Chromium and WebKit (Safari's engine): the browser tests run in both.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          PW_WEBKIT: '1'
      # Also when everything passed: a test that failed once and passed on
      # retry leaves its report (and "requests still loading") in test-results/.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  preview:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    # One preview Worker: deploy and check one pull request at a time, so a
    # check never runs against another pull request's deploy.
    concurrency:
      group: preview
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: secrets
        name: Check for Cloudflare secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No preview deploy: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not available (not set yet, or a pull request from a fork)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run build:draft
      - id: deploy
        name: Deploy the draft to the preview Worker
        if: steps.secrets.outputs.ready == 'true'
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        run: |
          set -o pipefail
          npx --no-install wrangler deploy --env preview 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(node scripts/deploy-url.mjs "$WRANGLER_OUTPUT_FILE_PATH" "$RUNNER_TEMP/deploy.log")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.secrets.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - name: Check the live preview
        if: steps.secrets.outputs.ready == 'true'
        env:
          DEPLOY_KIND: preview
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: npm run test:deployed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cannot deploy: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (README → Deploying)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The strict build. While anything is still a placeholder or missing it
      # fails here with the list, and nothing is deployed.
      - name: Build (strict — refuses placeholders and missing media)
        run: npm run build
      - name: Deploy to the production Worker
        run: npx --no-install wrangler deploy --env=""
      - id: site
        name: Read the real domain from the build
        run: echo "url=$(node scripts/site-url.mjs)" >> "$GITHUB_OUTPUT"
      - run: npx playwright install --with-deps chromium
      - name: Check the real site
        env:
          DEPLOY_KIND: production
          DEPLOY_URL: ${{ steps.site.outputs.url }}
        run: npm run test:deployed
      # Median of 3 mobile runs: LCP at most 2 s, CLS at most 0.1 (lighthouserc.json).
      - name: Measure loading speed
        run: npx --yes "$LHCI" autorun --collect.url="${{ steps.site.outputs.url }}/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-report
          path: |
            .lighthouseci/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
